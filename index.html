  ["Brandon Aubrey","K","DAL",3,1],["Jake Bates","K","DET",2,1],["Cameron Dicker","K","LAC",1,2],
  ["Chris Boswell","K","PIT",1,2],["Ka'imi Fairbairn","K","HOU",1,2],["Harrison Butker","K","KC",1,2],

  ["Ravens D/ST","DST","BAL",2,1],["Steelers D/ST","DST","PIT",1,2],["Vikings D/ST","DST","MIN",1,2],
  ["Bills D/ST","DST","BUF",1,2],["Seahawks D/ST","DST","SEA",1,2],["Packers D/ST","DST","GB",1,2],
  ["Lions D/ST","DST","DET",1,2],["49ers D/ST","DST","SF",1,2],["Chiefs D/ST","DST","KC",1,2],
];

const MY_KEEPERS = [
  { name: "Cam Skattebo", price: 8 },
  { name: "Jaxon Smith-Njigba", price: 25 },
  { name: "Tyler Warren", price: 11 },
];

const POS_META = {
  QB:  { color: "#FF6B4A", label: "QB"  },
  RB:  { color: "#57C785", label: "RB"  },
  WR:  { color: "#5BA8F5", label: "WR"  },
  TE:  { color: "#C792EA", label: "TE"  },
  K:   { color: "#9AA5B1", label: "K"   },
  DST: { color: "#6FC2C2", label: "DST" },
};
const POS_ORDER = ["ALL","RB","WR","TE","QB","K","DST"];

function AuctionSheet() {
  const freshPlayers = () =>
    PLAYERS.map((p, i) => ({
      id: i, name: p[0], pos: p[1], team: p[2], val: p[3], tier: p[4],
      drafted: false, mine: false, paid: 0,
    }));
  const [players, setPlayers] = useState(() => {
    try {
      const saved = localStorage.getItem("wss-draft-v1");
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length === PLAYERS.length) return parsed;
      }
    } catch (e) {}
    return freshPlayers();
  });
  const [posFilter, setPosFilter] = useState("ALL");
  const [query, setQuery] = useState("");
  const [hideDrafted, setHideDrafted] = useState(false);
  const [openId, setOpenId] = useState(null);
  const [bid, setBid] = useState(1);
  const [teams, setTeams] = useState(12);
  const [rosterSize, setRosterSize] = useState(17);
  const keepersLoaded = MY_KEEPERS.every(k => players.some(p => p.name === k.name && p.drafted && p.mine));
  const [showRoster, setShowRoster] = useState(false);
  const [showSettings, setShowSettings] = useState(false);

  const BUDGET = 200;

  const totals = useMemo(() => {
    const totalMoney = teams * BUDGET;
    const totalValue = players.reduce((s, p) => s + p.val, 0);
    const spent = players.filter(p => p.drafted).reduce((s, p) => s + p.paid, 0);
    const valueGone = players.filter(p => p.drafted).reduce((s, p) => s + p.val, 0);
    const baseRatio = totalMoney / Math.max(totalValue, 1);
    const nowRatio = (totalMoney - spent) / Math.max(totalValue - valueGone, 1);
    const inflation = nowRatio / baseRatio;
    const mine = players.filter(p => p.mine);
    const mySpent = mine.reduce((s, p) => s + p.paid, 0);
    const myRemaining = BUDGET - mySpent;
    const spotsLeft = Math.max(rosterSize - mine.length, 0);
    const maxBid = Math.max(myRemaining - Math.max(spotsLeft - 1, 0), 0);
    return { inflation, mine, mySpent, myRemaining, spotsLeft, maxBid };
  }, [players, teams, rosterSize]);

  const adj = (v) => Math.max(1, Math.round(v * totals.inflation));

  useEffect(() => {
    try { localStorage.setItem("wss-draft-v1", JSON.stringify(players)); } catch (e) {}
  }, [players]);

  const resetDraft = () => {
    if (window.confirm("Reset the entire draft board? This clears all picks, keepers, and value edits.")) {
      setPlayers(freshPlayers());
      setOpenId(null);
    }
  };

  const visible = useMemo(() => {
    const q = query.trim().toLowerCase();
    return players
      .filter(p => posFilter === "ALL" || p.pos === posFilter)
      .filter(p => !hideDrafted || !p.drafted)
      .filter(p => !q || p.name.toLowerCase().includes(q) || p.team.toLowerCase().includes(q))
      .sort((a, b) => b.val - a.val || a.name.localeCompare(b.name));
  }, [players, posFilter, query, hideDrafted]);

  const openPlayer = (p) => {
    if (openId === p.id) { setOpenId(null); return; }
    setOpenId(p.id);
    setBid(p.drafted ? p.paid : Math.min(adj(p.val), Math.max(totals.maxBid, 1)));
  };

  const draft = (id, mine) => {
    setPlayers(ps => ps.map(p => p.id === id ? { ...p, drafted: true, mine, paid: Math.max(1, bid) } : p));
    setOpenId(null);
  };
  const undo = (id) => {
    setPlayers(ps => ps.map(p => p.id === id ? { ...p, drafted: false, mine: false, paid: 0 } : p));
    setOpenId(null);
  };
  const nudge = (id, d) => {
    setPlayers(ps => ps.map(p => p.id === id ? { ...p, val: Math.max(1, p.val + d) } : p));
  };
  const loadKeepers = () => {
    setPlayers(ps => ps.map(p => {
      const k = MY_KEEPERS.find(k => k.name === p.name);
      return k ? { ...p, drafted: true, mine: true, paid: k.price } : p;
    }));
  };

  const infPct = Math.round((totals.inflation - 1) * 100);

  return (
    <div className="wrap">
      <style>{css}</style>

      {/* Scoreboard */}
      <header className="board">
        <div className="board-title">
          <span className="board-eyebrow">$200 Keeper Auction · Standard · Half-Yardage</span>
          <h1>WHY SO SERIOUS?</h1>
        </div>
        <div className="ticker">
          <div className="tick">
            <span className="tick-label">Budget left</span>
            <span className="tick-num">${totals.myRemaining}</span>
          </div>
          <div className="tick tick-max">
            <span className="tick-label">Max bid</span>
            <span className="tick-num">${totals.maxBid}</span>
          </div>
          <div className="tick">
            <span className="tick-label">Spots left</span>
            <span className="tick-num">{totals.spotsLeft}</span>
          </div>
          <div className="tick">
            <span className="tick-label">Inflation</span>
            <span className="tick-num">{infPct >= 0 ? "+" : ""}{infPct}%</span>
          </div>
        </div>
      </header>

      {/* Keeper loader */}
      {!keepersLoaded && (
        <div className="keeper-bar">
          <div>
            <strong>Load your keepers?</strong>
            <span> Skattebo $8 · JSN $25 · T. Warren $11 — $44 total</span>
          </div>
          <button className="btn btn-amber" onClick={loadKeepers}>Load keepers</button>
        </div>
      )}

      {/* Controls */}
      <div className="controls">
        <div className="chips">
          {POS_ORDER.map(pos => (
            <button
              key={pos}
              className={"chip" + (posFilter === pos ? " chip-on" : "")}
              style={posFilter === pos && pos !== "ALL" ? { background: POS_META[pos].color, color: "#0d1f16", borderColor: POS_META[pos].color } : {}}
              onClick={() => setPosFilter(pos)}
            >{pos}</button>
          ))}
        </div>
        <div className="control-row">
          <input
            className="search"
            placeholder="Search player or team"
            value={query}
            onChange={e => setQuery(e.target.value)}
          />
          <button className={"btn btn-ghost" + (hideDrafted ? " btn-ghost-on" : "")} onClick={() => setHideDrafted(v => !v)}>
            {hideDrafted ? "Showing available" : "Hide drafted"}
          </button>
        </div>
        <div className="control-row control-links">
          <button className="linkish" onClick={() => setShowRoster(v => !v)}>
            My roster ({totals.mine.length}) — ${totals.mySpent}
          </button>
          <button className="linkish" onClick={() => setShowSettings(v => !v)}>League settings</button>
        </div>
        {showSettings && (
          <div className="settings">
            <label>Teams
              <input type="number" min="8" max="16" value={teams} onChange={e => setTeams(Math.max(2, +e.target.value || 12))} />
            </label>
            <label>Roster size
              <input type="number" min="10" max="25" value={rosterSize} onChange={e => setRosterSize(Math.max(1, +e.target.value || 17))} />
            </label>
          </div>
        )}
        {showRoster && (
          <div className="roster">
            {totals.mine.length === 0 && <div className="roster-empty">No players yet. Load your keepers or win a bid.</div>}
            {totals.mine.sort((a,b) => b.paid - a.paid).map(p => (
              <div className="roster-row" key={p.id}>
                <span className="pos-dot" style={{ background: POS_META[p.pos].color }} />
                <span className="roster-name">{p.name}</span>
                <span className="roster-price">${p.paid}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Board list */}
      <main className="list">
        {visible.map((p, idx) => {
          const meta = POS_META[p.pos];
          const prevTier = idx > 0 ? visible[idx - 1].tier : null;
          const samePosView = posFilter !== "ALL";
          const tierBreak = samePosView && prevTier !== null && p.tier !== prevTier;
          const open = openId === p.id;
          return (
            <div key={p.id}>
              {tierBreak && <div className="tier-line"><span>Tier {p.tier}</span></div>}
              <div
                className={"row" + (p.drafted ? " row-gone" : "") + (p.mine ? " row-mine" : "")}
                onClick={() => openPlayer(p)}
              >
                <span className="pos-tag" style={{ background: meta.color }}>{meta.label}</span>
                <span className="row-name">
                  {p.name}
                  <span className="row-team">{p.team}{samePosView ? "" : ` · T${p.tier}`}</span>
                </span>
                {p.drafted ? (
                  <span className="row-paid">{p.mine ? "MINE" : "GONE"} · ${p.paid}</span>
                ) : (
                  <span className="row-val">
                    ${adj(p.val)}
                    {adj(p.val) !== p.val && <span className="row-base">${p.val}</span>}
                  </span>
                )}
              </div>
              {open && (
                <div className="panel">
                  {!p.drafted ? (
                    <>
                      <div className="bidder">
                        <button className="step" onClick={() => setBid(b => Math.max(1, b - 1))}>−</button>
                        <span className="bid-num">${bid}</span>
                        <button className="step" onClick={() => setBid(b => b + 1)}>+</button>
                        <div className="bid-quick">
                          {[1, 5].map(n => (
                            <button key={n} className="mini" onClick={() => setBid(b => b + n)}>+{n}</button>
                          ))}
                        </div>
                      </div>
                      <div className="panel-actions">
                        <button className="btn btn-amber" disabled={bid > totals.maxBid} onClick={() => draft(p.id, true)}>
                          I won it
                        </button>
                        <button className="btn btn-ghost" onClick={() => draft(p.id, false)}>Other team</button>
                      </div>
                      {bid > totals.maxBid && <div className="warn">Over your max bid of ${totals.maxBid}</div>}
                      <div className="value-tune">
                        Value ${p.val}
                        <button className="mini" onClick={() => nudge(p.id, -1)}>−1</button>
                        <button className="mini" onClick={() => nudge(p.id, 1)}>+1</button>
                      </div>
                    </>
                  ) : (
                    <div className="panel-actions">
                      <span className="panel-note">{p.mine ? "On your roster" : "Drafted by another team"} for ${p.paid}</span>
                      <button className="btn btn-ghost" onClick={() => undo(p.id)}>Undo</button>
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
        {visible.length === 0 && <div className="empty">No players match. Clear the search or filters.</div>}
      </main>

      <footer className="foot">
        Values are estimates tuned to this league's scoring (no PPR, half-yardage, TD-heavy) for a {teams}-team, $200 budget.
        Adjusted prices rise and fall with draft-room inflation as picks come in. Your board saves automatically on this device.
        <div style={{ marginTop: 12 }}>
          <button className="btn btn-ghost" onClick={resetDraft}>Reset draft board</button>
        </div>
      </footer>
    </div>
  );
}

.control-row { display: flex; gap: 8px; margin-top: 8px; }
.search {
  flex: 1; font-family: inherit; font-size: 16px; padding: 8px 12px;
  border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
  background: rgba(0,0,0,0.3); color: #F1F7F0; min-width: 0;
}
.search::placeholder { color: #7E9C88; }
.btn {
  font-family: inherit; font-weight: 600; font-size: 15px; letter-spacing: 0.03em;
  padding: 8px 14px; border-radius: 8px; border: 1px solid transparent; cursor: pointer;
  white-space: nowrap;
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-amber { background: #FFC53D; color: #201700; }
.btn-ghost { background: transparent; color: #DCEADF; border-color: rgba(255,255,255,0.25); }
.btn-ghost-on { background: rgba(255,255,255,0.12); }
.control-links { justify-content: space-between; }
.linkish {
  background: none; border: none; color: #9FC7AC; font-family: inherit;
  font-size: 15px; font-weight: 600; cursor: pointer; padding: 4px 0;
  text-decoration: underline; text-underline-offset: 3px;
}
.settings { display: flex; gap: 16px; margin-top: 8px; }
.settings label { font-size: 14px; color: #9FC7AC; display: flex; align-items: center; gap: 6px; }
.settings input {
  width: 56px; font-family: 'IBM Plex Mono', monospace; font-size: 15px;
  padding: 4px 6px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2);
  background: rgba(0,0,0,0.3); color: #F1F7F0;
}
.roster { margin-top: 8px; border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 6px 10px; background: rgba(0,0,0,0.25); }
.roster-empty { padding: 8px 2px; color: #8FAE98; font-size: 14px; }
.roster-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.07); font-size: 16px; }
.roster-row:last-child { border-bottom: none; }
.pos-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.roster-name { flex: 1; }
.roster-price { font-family: 'IBM Plex Mono', monospace; color: #FFC53D; font-size: 14px; font-weight: 600; }

.list { padding: 6px 12px 0; }
.tier-line {
  display: flex; align-items: center; gap: 10px; margin: 12px 4px 4px;
  color: #8FAE98; font-size: 12.5px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600;
}
.tier-line::before, .tier-line::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.16); }
.row {
  display: flex; align-items: center; gap: 10px; padding: 9px 8px;
  border-bottom: 1px solid rgba(255,255,255,0.08); cursor: pointer;
  border-radius: 6px;
}
.row:active { background: rgba(255,255,255,0.06); }
.pos-tag {
  font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #0d1f16;
  border-radius: 4px; padding: 2px 6px; min-width: 34px; text-align: center; flex-shrink: 0;
}
.row-name { flex: 1; font-size: 18px; font-weight: 600; line-height: 1.15; min-width: 0; }
.row-team { display: block; font-size: 12.5px; color: #8FAE98; font-weight: 500; letter-spacing: 0.04em; }
.row-val {
  font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 18px;
  color: #FFC53D; font-variant-numeric: tabular-nums; text-align: right;
}
.row-base { display: block; font-size: 11px; color: #7E9C88; text-decoration: line-through; font-weight: 500; }
.row-gone { opacity: 0.42; }
.row-gone .row-name { text-decoration: line-through; }
.row-mine { opacity: 1; background: rgba(255,197,61,0.07); }
.row-mine .row-name { text-decoration: none; }
.row-paid { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; color: #CFE3D2; }
.row-mine .row-paid { color: #FFC53D; }

.panel {
  margin: 2px 4px 10px; padding: 12px; border-radius: 10px;
  background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.15);
}
.bidder { display: flex; align-items: center; gap: 12px; }
.step {
  width: 42px; height: 42px; font-size: 24px; border-radius: 8px; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.25); background: transparent; color: #F1F7F0;
  font-family: inherit;
}
.bid-num {
  font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 600;
  color: #FFC53D; min-width: 64px; text-align: center; font-variant-numeric: tabular-nums;
}
.bid-quick { display: flex; gap: 6px; margin-left: auto; }
.mini {
  font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 5px 9px;
  border-radius: 6px; border: 1px solid rgba(255,255,255,0.22);
  background: transparent; color: #DCEADF; cursor: pointer;
}
.panel-actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
.panel-note { font-size: 15px; color: #CFE3D2; flex: 1; }
.warn { margin-top: 8px; font-size: 13.5px; color: #FF9E7A; }
.value-tune {
  margin-top: 12px; display: flex; align-items: center; gap: 8px;
  font-size: 13.5px; color: #8FAE98;
}
.empty { padding: 28px 8px; text-align: center; color: #8FAE98; font-size: 16px; }
.foot { padding: 18px 20px 0; font-size: 13px; color: #7E9C88; line-height: 1.5; max-width: 640px; }

@media (min-width: 700px) {
  .board, .controls, .foot { max-width: 760px; margin-left: auto; margin-right: auto; }
  .list { max-width: 760px; margin: 0 auto; }
  .board h1 { font-size: 44px; }
}
`;


ReactDOM.createRoot(document.getElementById("root")).render(<AuctionSheet />);
</script>
</body>
</html>
