<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilimoriya League Draft Board</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e8eaed; --sub:#9aa3b2; --accent:#4f8cff; --green:#2fbf71;
    --yellow:#e6b800; --red:#e5484d; --purple:#a76bf0;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:1400px;margin:0 auto;padding:16px;}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px;}
  h1{font-size:20px;margin:0;}
  .sub{color:var(--sub);font-size:13px;}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  input[type=text]{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:8px;font-size:14px;width:220px;}
  .posbtn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;}
  .posbtn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .layout{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start;}
  @media (max-width:900px){.layout{grid-template-columns:1fr;}}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--sub);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);}
  td{padding:7px 8px;border-bottom:1px solid #20242e;}
  tr.drafted td{opacity:.28;text-decoration:line-through;}
  tr:hover td{background:#1c2029;}
  .tablewrap{max-height:72vh;overflow:auto;}
  .pos-QB{color:#ff8a4c;} .pos-RB{color:#4fd67a;} .pos-WR{color:#4fa6ff;} .pos-TE{color:#e6b800;} .pos-K{color:#c58cf0;} .pos-DEF{color:#9aa3b2;}
  .tier{display:inline-block;font-size:11px;padding:2px 6px;border-radius:6px;background:var(--panel2);border:1px solid var(--border);color:var(--sub);}
  .flag{font-size:11px;padding:2px 6px;border-radius:6px;margin-left:6px;font-weight:600;}
  .flag.good{background:rgba(47,191,113,.15);color:var(--green);border:1px solid rgba(47,191,113,.35);}
  .flag.warn{background:rgba(230,184,0,.15);color:var(--yellow);border:1px solid rgba(230,184,0,.35);}
  .flag.bad{background:rgba(229,72,77,.15);color:var(--red);border:1px solid rgba(229,72,77,.35);}
  .note{display:block;color:var(--sub);font-size:11.5px;margin-top:2px;}
  .draftbtn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px;white-space:nowrap;}
  .draftbtn:hover{border-color:var(--accent);}
  tr.drafted .draftbtn{background:var(--accent);border-color:var(--accent);color:#fff;opacity:1;text-decoration:none;}
  .rosterslot{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:8px;margin-bottom:4px;background:var(--panel2);border:1px solid var(--border);font-size:13px;}
  .rosterslot.filled{border-color:var(--green);}
  .slotlabel{color:var(--sub);width:44px;font-weight:700;font-size:12px;}
  .slotname{flex:1;padding-left:8px;}
  .removebtn{background:none;border:none;color:var(--red);cursor:pointer;font-size:12px;}
  h3{margin:0 0 8px;font-size:14px;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;}
  .statline{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:12.5px;color:var(--sub);}
  .statline b{color:var(--text);}
  .resetbtn{background:none;border:1px solid var(--border);color:var(--sub);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px;}
  .needbadge{font-size:11px;padding:2px 7px;border-radius:20px;background:rgba(229,72,77,.15);color:var(--red);border:1px solid rgba(229,72,77,.35);margin-left:6px;}
  .needbadge.ok{background:rgba(47,191,113,.15);color:var(--green);border:1px solid rgba(47,191,113,.35);}
  ::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-thumb{background:#2a2f3a;border-radius:6px;}
</style>
</head>

<div class="wrap">
  <header>
    <div>
      <h1>🏈 Bilimoriya League — Live Draft Board</h1>
      <div class="sub">12-team · Half-PPR · Snake draft · Wed Sep 2, 8:30pm ET · Updated with Sept 2 injury news</div>
    </div>
    <button class="resetbtn" onclick="resetAll()">Reset draft</button>
  </header>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Search player or team..." oninput="render()">
    <button class="posbtn active" data-pos="ALL" onclick="setPos('ALL')">All</button>
    <button class="posbtn" data-pos="QB" onclick="setPos('QB')">QB</button>
    <button class="posbtn" data-pos="RB" onclick="setPos('RB')">RB</button>
    <button class="posbtn" data-pos="WR" onclick="setPos('WR')">WR</button>
    <button class="posbtn" data-pos="TE" onclick="setPos('TE')">TE</button>

    <button class="posbtn" id="flaggedBtn" data-pos="FLAG" onclick="setPos('FLAG')">⚠ Injury notes</button>
  </div>

  <div class="layout">
    <div class="panel">
      <div class="statline" id="statline"></div>
      <div class="tablewrap">
        <table>
          <thead>
            <tr><th style="width:32px">#</th><th>Player</th><th>Pos</th><th>Team</th><th style="width:40px">Bye</th><th style="width:56px">Tier</th><th style="width:90px"></th></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <h3>Your Roster <span id="pickCount" class="sub"></span></h3>

      <h3 style="margin-top:16px">Positional Needs</h3>

    </div>
  </div>
</div>

function tierOf(r){
  if(r<=12) return 1; if(r<=24) return 2; if(r<=36) return 3; if(r<=50) return 4;
  if(r<=65) return 5; if(r<=80) return 6; if(r<=100) return 7; if(r<=115) return 8; return 9;
}
players.forEach(pl=>pl.tier=tierOf(pl.r));

// ---- Bilimoriya roster shape ----
const ROSTER_SLOTS = [
  {label:"QB",match:["QB"]},
  {label:"WR",match:["WR"]},
  {label:"WR",match:["WR"]},
  {label:"RB",match:["RB"]},
  {label:"RB",match:["RB"]},
  {label:"TE",match:["TE"]},
  {label:"FLEX",match:["RB","WR","TE"]},
  {label:"K",match:["K"]},
  {label:"DEF",match:["DEF"]},
  {label:"BN",match:["QB","RB","WR","TE","K","DEF"]},
  {label:"BN",match:["QB","RB","WR","TE","K","DEF"]},
  {label:"BN",match:["QB","RB","WR","TE","K","DEF"]},
  {label:"BN",match:["QB","RB","WR","TE","K","DEF"]},
  {label:"BN",match:["QB","RB","WR","TE","K","DEF"]},
  {label:"BN",match:["QB","RB","WR","TE","K","DEF"]},
];

let state = { drafted: {}, myTeam: [] }; // drafted: {rank: true/'me'}
let posFilter = "ALL";

function save(){ try{ localStorage.setItem('bilimoriyaDraft', JSON.stringify(state)); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem('bilimoriyaDraft');
    if(raw) state = JSON.parse(raw);
  }catch(e){}
}
function resetAll(){
  if(!confirm('Reset the whole draft board? This clears all drafted players and your roster.')) return;
  state = { drafted:{}, myTeam:[] };
  save(); render();
}

function setPos(p){
  posFilter = p;
  document.querySelectorAll('.posbtn').forEach(b=>b.classList.toggle('active', b.dataset.pos===p));
  render();
}

function toggleDraft(rank, mine){
  if(state.drafted[rank]){
    // undo
    delete state.drafted[rank];
    state.myTeam = state.myTeam.filter(r=>r!==rank);
  } else {
    state.drafted[rank] = mine ? 'me' : 'other';
    if(mine) state.myTeam.push(rank);
  }
  save(); render();
}

function bestFitLabel(pos){
  // used for roster assignment greedy fill
  return pos;
}

function computeRoster(){
  const picks = state.myTeam.map(r=>players.find(p=>p.r===r)).filter(Boolean);
  // sort by rank so best players fill best-fit slots first
  picks.sort((a,b)=>a.r-b.r);
  const slots = ROSTER_SLOTS.map(s=>({...s, filled:null}));
  picks.forEach(pl=>{
    // try to find an open slot matching, preferring non-flex/non-bench specific slot first
    let slot = slots.find(s=>!s.filled && s.match.length===1 && s.match[0]===pl.p);
    if(!slot) slot = slots.find(s=>!s.filled && s.match.includes(pl.p) && s.label==='FLEX');
    if(!slot) slot = slots.find(s=>!s.filled && s.label==='BN');
    if(slot) slot.filled = pl;
  });
  return slots;
}

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  let list = players;
  if(posFilter==='FLAG') list = list.filter(p=>p.flag);
  else if(posFilter!=='ALL') list = list.filter(p=>p.p===posFilter);
  if(q) list = list.filter(p=>p.n.toLowerCase().includes(q) || p.t.toLowerCase().includes(q));

  list.forEach(p=>{
    const tr = document.createElement('tr');
    const draftedState = state.drafted[p.r];
    if(draftedState) tr.classList.add('drafted');
    const flagHtml = p.flag ? `<span class="flag ${p.flag}">${p.flag==='bad'?'⛔':p.flag==='warn'?'⚠':'✓'} ${p.flag==='bad'?'RISK':p.flag==='warn'?'WATCH':'CLEARED'}</span>` : '';
    const noteHtml = p.note ? `<span class="note">${p.note}</span>` : '';
    tr.innerHTML = `
      <td>${p.r}</td>
      <td><strong>${p.n}</strong>${flagHtml}${noteHtml}</td>
      <td class="pos-${p.p}">${p.p}</td>
      <td>${p.t}</td>
      <td>${p.bye}</td>
      <td><span class="tier">T${p.tier}</span></td>
      <td>
        ${draftedState ?
          `<button class="draftbtn" onclick="toggleDraft(${p.r})">${draftedState==='me'?'✓ Mine':'Undo'}</button>`
          : `<button class="draftbtn" onclick="toggleDraft(${p.r}, true)">Draft (me)</button>
             <button class="draftbtn" style="margin-left:4px" onclick="toggleDraft(${p.r}, false)">Taken</button>`
        }
      </td>`;
    tbody.appendChild(tr);
  });

  const totalDrafted = Object.keys(state.drafted).length;
  document.getElementById('statline').innerHTML =
    `<span><b>${players.length - totalDrafted}</b> available</span>
     <span><b>${totalDrafted}</b> drafted total</span>
     <span><b>${state.myTeam.length}</b> on your team</span>`;

  // roster panel
  const slots = computeRoster();
  const rosterDiv = document.getElementById('roster');
  rosterDiv.innerHTML = slots.map(s=>{
    return `<div class="rosterslot ${s.filled?'filled':''}">
      <span class="slotlabel">${s.label}</span>
      <span class="slotname">${s.filled ? s.filled.n + ' <span class="sub">('+s.filled.t+')</span>' : '—'}</span>
      ${s.filled?`<button class="removebtn" onclick="toggleDraft(${s.filled.r})">✕</button>`:''}
    </div>`;
  }).join('');
  document.getElementById('pickCount').textContent = `(${state.myTeam.length}/${ROSTER_SLOTS.length})`;

  // needs
  const needCounts = {QB:0,RB:0,WR:0,TE:0,K:0,DEF:0};
  state.myTeam.forEach(r=>{ const pl=players.find(x=>x.r===r); if(pl) needCounts[pl.p]++; });
  const targets = {QB:1,RB:3,WR:3,TE:1,K:1,DEF:1}; // rough starter+flex targets, bench flexible
  const needsDiv = document.getElementById('needs');
  needsDiv.innerHTML = Object.keys(targets).map(pos=>{
    const have = needCounts[pos]||0;
    const need = targets[pos];
    const ok = have>=need;
    return `<div>${pos}: <b>${have}</b> drafted ${ok?'<span class="needbadge ok">filled</span>':'<span class="needbadge">need '+(need-have)+' more</span>'}</div>`;
  }).join('');
}

load();
render();
</script>
</body>
</html>
